colorlog = "^6.6.0"
pyproj = "^3.3.0"
pyusb = "^1.2.1"
matplotlib = "^3.5.1"
utm = "^0.7.0"
Shapely = "^1.8.1"
nptyping = "^2.3.1"
scipy = "^1.9.3"
ticlib = "^0.2.2"
pandas = "^1.5.3"
psutil = "^5.9.4"
pyyaml = "^6.0"
seaborn = "^0.12.2"
gitpython = "^3.1.31"
setuptools = "^67.4.0"
geopy = "^2.3.0"
pyserial = "^3.5"
pathfinding = "^1.0.1"
siyi-sdk = "^0.2.12"
ffmpeg-python = "^0.2.0"
aiohttp = "^3.11.11"
aiofiles = "^24.1.0"
onnxruntime = "^1.20.1"
dronekit = {url = "https://github.com/MissouriMRR/docs/raw/refs/heads/main/subteams/flight/installation_guide/dronekit-2.9.2-py310-none-any.whl"}
